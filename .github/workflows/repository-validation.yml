name: Repository validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    name: Markdown and links
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@4580e1612f6407034edd6c0e4e316d725920867b # v24.2.0
        with:
          globs: |
            **/*.md

      - name: Check Markdown links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --root-dir "${{ github.workspace }}"
            --include-fragments
            --include-mail=false
            --max-retries 2
            --timeout 20
            --no-progress
            "**/*.md"
          fail: true

  repository-policy:
    name: Configuration and repository policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject prohibited files and unpinned actions
        shell: pwsh
        run: ./infrastructure/scripts/validate-repository.ps1

      - name: Validate Docker Compose configuration
        env:
          F2S_POSTGRES_PASSWORD: ci-validation-placeholder-not-a-secret
        run: docker compose --env-file .env.example config --quiet

      - name: Build backend container
        run: docker compose --env-file .env.example build api

  backend-static:
    name: Backend static
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install locked Python tooling
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          python-version: "3.13.14"
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Synchronise locked dependencies
        run: uv sync --frozen --all-groups

      - name: Check formatting
        run: uv run --frozen ruff format --check .

      - name: Lint backend
        run: uv run --frozen ruff check .

      - name: Type-check backend
        run: uv run --frozen mypy app tests

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18.4-trixie
        env:
          POSTGRES_DB: f2s_test
          POSTGRES_USER: f2s_test_owner
          POSTGRES_PASSWORD: ci-validation-placeholder-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=f2s_test_owner --dbname=f2s_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      F2S_ENVIRONMENT: test
      F2S_DATABASE_HOST: 127.0.0.1
      F2S_DATABASE_PORT: "5432"
      F2S_DATABASE_NAME: f2s_test
      F2S_DATABASE_USER: f2s_test_owner
      F2S_DATABASE_PASSWORD: ci-validation-placeholder-not-a-secret
      F2S_DATABASE_SSLMODE: disable
      F2S_IDENTITY_DIGEST_KEY: ci-identity-digest-placeholder-not-a-secret
      F2S_RUN_POSTGRES_TESTS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install locked Python tooling
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          python-version: "3.13.14"
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Synchronise locked dependencies
        run: uv sync --frozen --all-groups

      - name: Run backend and PostgreSQL integration tests
        run: uv run --frozen pytest

  frontend:
    name: Frontend validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: frontend/package.json
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.1
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Check frontend formatting
        run: pnpm format:check

      - name: Lint frontend
        run: pnpm lint

      - name: Type-check frontend
        run: pnpm typecheck

      - name: Test frontend
        run: pnpm test

      - name: Build frontend
        env:
          VITE_API_BASE_URL: https://api.example.invalid/api/v1
        run: pnpm build

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
