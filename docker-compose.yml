services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      F2S_ENVIRONMENT: local
      F2S_DEBUG: "false"
      F2S_DOCS_ENABLED: "false"
      F2S_DATABASE_HOST: postgres
      F2S_DATABASE_PORT: "5432"
      F2S_DATABASE_NAME: ${F2S_POSTGRES_DB:-f2s_local}
      F2S_DATABASE_USER: ${F2S_POSTGRES_USER:-f2s_local_owner}
      F2S_DATABASE_PASSWORD: ${F2S_POSTGRES_PASSWORD:?Set F2S_POSTGRES_PASSWORD in .env}
      F2S_DATABASE_SSLMODE: disable
    ports:
      - "127.0.0.1:${F2S_API_HOST_PORT:-8000}:8000"
    networks:
      - data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    init: true
    stop_grace_period: 30s

  postgres:
    image: postgres:18.4-trixie
    environment:
      POSTGRES_DB: ${F2S_POSTGRES_DB:-f2s_local}
      POSTGRES_USER: ${F2S_POSTGRES_USER:-f2s_local_owner}
      POSTGRES_PASSWORD: ${F2S_POSTGRES_PASSWORD:?Set F2S_POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${F2S_POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --username="$${POSTGRES_USER}" --dbname="$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    shm_size: 128mb
    stop_grace_period: 60s

networks:
  data:
    driver: bridge

volumes:
  postgres_data:
